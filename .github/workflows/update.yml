name: Perbarui data dan terbitkan situs

on:
  schedule:
    # Setiap hari pukul 23.00 UTC (06.00 WIB).
    - cron: "0 23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Cetak log seketika, supaya lama setiap langkah terlihat di log Actions.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jalankan pengujian
        run: python -m unittest discover -s tests -t .

      - name: Ambil makalah, sinyal, dan ringkasan
        # Saat ada push kode, cukup bangun ulang situs dari data yang ada.
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m lentera update

      - name: Simpan data ke repositori
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "Perbarui data makalah $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Bangun situs
        env:
          # Alamat Worker pencarian semantik (variabel repositori, bukan secret).
          LENTERA_WORKER_URL: ${{ vars.WORKER_URL }}
        run: python -m lentera build --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
