# Setiap entri cukup memakai SATU pengenal:
#   arxiv = "2506.21563"            ID arXiv (tanpa versi)
#   acl   = "2025.acl-long.1377"    ID ACL Anthology
#   doi   = "10.2139/ssrn.6400298"  DOI, diambil lewat OpenAlex
#   title = "Judul lengkap"         dicari lewat OpenAlex jika tidak ada ID
# `note` hanya catatan untuk pengelola dan tidak ditampilkan di situs.
