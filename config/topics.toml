# Konfigurasi utama Lentera Riset.
#
# Untuk memperluas cakupan, cukup tambahkan blok [[topics]] baru atau
# tambahkan kata kunci pada topik yang sudah ada. Tidak perlu mengubah kode.

[site]
title = "Lentera Riset"
tagline = "Riset NLP bahasa berdaya sumber rendah dan bahasa Austronesia, diringkas dalam bahasa Inggris dan Indonesia."
repo_url = "https://github.com/FeliksMakarios/lentera-riset"
# Alamat situs setelah terbit, dipakai untuk tautan di RSS.
site_url = "https://feliksmakarios.github.io/lentera-riset"
# Jumlah makalah maksimum yang ditampilkan di halaman depan.
max_papers_on_index = 300

[arxiv]
# Kategori arXiv yang dipantau.
categories = ["cs.CL", "cs.AI", "cs.LG", "cs.SD", "eess.AS"]
# Jumlah hasil per kueri topik (arXiv menyarankan tidak lebih dari 2000).
max_results_per_topic = 100
# Percobaan ulang saat API arXiv menolak (406/429/503) dan jeda awalnya (detik), naik dua kali lipat.
api_retries = 3
api_backoff_seconds = 15
# Jeda antarpermintaan ke arXiv, dalam detik (aturan arXiv: minimal 3 detik).
request_delay_seconds = 3.5
# Makalah yang lebih tua dari ini tidak diambil lagi dan sinyalnya tidak diperbarui.
lookback_days = 60

[acl]
# ACL Anthology, lewat data XML terbuka di GitHub (acl-org/acl-anthology).
enabled = true
# Volume yang masuk ke Anthology dalam rentang ini ikut diambil.
lookback_days = 120
# Batas berkas XML yang diunduh per sekali jalan.
max_files_per_run = 150

[openalex]
# OpenAlex, untuk jurnal dan konferensi di luar arXiv dan ACL (misalnya IEEE).
# Perlu kunci API gratis dari https://openalex.org/settings/api (secret OPENALEX_API_KEY).
enabled = true
lookback_days = 60
max_results_per_topic = 200

[ranking]
# Makalah baru disimpan jika skor relevansinya mencapai ambang ini.
min_relevance = 2.0
# Waktu paruh (hari) untuk penurunan skor berdasarkan umur makalah.
half_life_days = 14

[summaries]
# Jumlah maksimum ringkasan baru per sekali jalan, supaya kuota gratis tidak habis.
max_per_run = 20
# Baca isi lengkap makalah (PDF akses terbuka). Jika PDF tidak tersedia,
# ringkasan dibuat dari abstrak.
use_full_text = true
# Batas ukuran PDF (MB) yang dikirim ke Gemini.
max_pdf_mb = 14
# Jeda antarpanggilan Gemini, dalam detik (kuota gratis dibatasi per menit).
request_delay_seconds = 7
# Model dicoba berurutan; model berikutnya dipakai jika model sebelumnya tidak ada,
# sedang sibuk, atau kuotanya habis. Alias "-latest" selalu menunjuk versi terbaru.
# Jika semuanya tidak tersedia, daftar model Flash dicari otomatis.
models = ["gemini-flash-latest", "gemini-flash-lite-latest", "gemini-2.5-flash-lite"]

# ---------------------------------------------------------------------------
# Topik. `weight` menentukan seberapa besar satu kata kunci menambah skor
# relevansi. Kata kunci dicocokkan pada judul dan abstrak, tanpa membedakan
# huruf besar dan kecil, dan harus berupa kata utuh.
# Kata kunci juga cocok dengan bentuk jamaknya ("language" = "languages"), dan
# spasi setara dengan tanda hubung ("low resource" = "low-resource").
# `query = false` berarti kata kunci hanya dipakai untuk penilaian, tidak
# untuk kueri ke arXiv (berguna untuk kata yang terlalu umum).
# `core = false` berarti topik pendukung: hanya menambah skor jika makalah juga
# cocok dengan minimal satu topik inti. Bawaannya sama dengan nilai `query`.
# ---------------------------------------------------------------------------

[[topics]]
id = "indonesia"
label_id = "Bahasa Indonesia dan bahasa daerah"
label_en = "Indonesian and regional languages"
weight = 3.0
query = true
keywords = [
  "Indonesian", "Bahasa Indonesia", "Javanese", "Sundanese", "Balinese",
  "Madurese", "Minangkabau", "Acehnese", "Buginese", "Banjarese", "Banjar",
  "Batak", "Toba Batak", "Batak Toba", "Karo", "Mandailing", "Sasak",
  "Makassarese", "Betawi", "Ngaju", "Lampung", "Nias", "Toraja",
  "Gorontalo", "Rejang", "Dayak", "Ambonese", "Papuan Malay",
  "IndoNLU", "IndoNLG", "IndoLEM", "IndoBERT", "NusaX", "NusaCrowd",
  "NusaWrites", "NusaTranslation", "SEACrowd", "IndoNLP", "Cendol",
]

[[topics]]
id = "austronesia"
label_id = "Bahasa Austronesia lainnya"
label_en = "Other Austronesian languages"
weight = 2.5
query = true
keywords = [
  "Austronesian", "Malayo-Polynesian", "Malay", "Tagalog", "Filipino",
  "Cebuano", "Ilocano", "Hiligaynon", "Waray", "Bikol", "Kapampangan",
  "Malagasy", "Maori", "Hawaiian", "Samoan", "Tongan", "Fijian", "Tetum",
  "Chamorro", "Formosan", "Amis", "Atayal", "Paiwan", "Cham", "Bislama",
  "Tok Pisin",
]

[[topics]]
id = "sea"
label_id = "Asia Tenggara"
label_en = "Southeast Asia"
weight = 1.5
query = true
keywords = [
  "Southeast Asian", "Southeast Asia", "SEA languages", "SeaLLM", "SeaLLMs",
  "SEA-LION", "Sailor", "Nusantara",
]

[[topics]]
id = "low-resource"
label_id = "Bahasa berdaya sumber rendah"
label_en = "Low-resource languages"
weight = 2.0
query = true
# Frasa "low-resource" saja sering berarti sumber daya komputasi yang terbatas,
# jadi di sini yang dipakai adalah frasa yang jelas merujuk ke bahasa.
keywords = [
  "low-resource language", "low resource language", "low-resourced language",
  "under-resourced language", "resource-poor language", "resource-scarce language",
  "less-resourced language", "lesser-resourced language", "extremely low-resource language",
  "low-resource machine translation", "low-resource translation", "low-resource NLP",
  "low-resource speech", "low-resource ASR", "low-resource speech recognition",
  "endangered language", "indigenous language", "language documentation",
  "underrepresented language", "under-represented language", "regional language",
  "minority language", "language revitalization",
]

[[topics]]
id = "multilingual"
label_id = "Multibahasa dan lintas bahasa"
label_en = "Multilingual and cross-lingual"
weight = 0.75
query = false
keywords = [
  "low-resource", "under-resourced", "data-scarce", "few-shot",
  "multilingual", "cross-lingual", "crosslingual", "code-switching",
  "code-mixed", "code-mixing", "transliteration", "language transfer",
  "machine translation", "parallel corpus", "dialect",
  "Universal Dependencies", "treebank",
]
