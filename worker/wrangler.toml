# Cloudflare Worker untuk pencarian semantik dan tanya jawab makalah. Diterbitkan otomatis oleh
# .github/workflows/worker.yml; lihat README bagian "Pencarian semantik".
name = "lentera-riset"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Harus sama dengan model dan dimensions di [embeddings] pada config/topics.toml.
EMBED_MODEL = "gemini-embedding-001"
EMBED_DIMENSIONS = "256"
# Model untuk tanya jawab makalah, dicoba berurutan jika model sebelumnya sibuk.
ASK_MODELS = "gemini-flash-lite-latest,gemini-flash-latest"
# Alamat situs; Worker mengambil keterangan makalah dari qa/<id>.json di sini.
SITE_URL = "https://feliksmakarios.github.io/lentera-riset/"
# Asal halaman yang boleh memakai Worker ini, dipisahkan koma.
ALLOWED_ORIGINS = "https://feliksmakarios.github.io,http://localhost:8000,http://127.0.0.1:8000"
# Batas harian untuk semua pengunjung (bukan per IP), dihitung per hari UTC. Setelah batas
# tercapai, Worker menolak dengan kode 429 sampai hari berganti. Isi "0" untuk mematikan.
ASK_DAILY_LIMIT = "300"
EMBED_DAILY_LIMIT = "3000"

# Penghitung batas harian (worker/src/usage.js). Durable Object berbasis SQLite tersedia
# di paket gratis Cloudflare.
[[durable_objects.bindings]]
name = "USAGE"
class_name = "UsageCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageCounter"]

# Batas 30 pencarian per menit untuk setiap alamat IP, supaya kuota Gemini tidak
# dihabiskan oleh satu pengguna.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Tanya jawab lebih mahal (PDF ikut dibaca), jadi batasnya 6 pertanyaan per menit.
[[ratelimits]]
name = "ASK_LIMITER"
namespace_id = "1002"
simple = { limit = 6, period = 60 }
